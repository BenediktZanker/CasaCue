version: '3.8'

services:
  # PostgreSQL Database Service
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: casacue
      POSTGRES_PASSWORD: password
      POSTGRES_DB: casacue
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casacue"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Backend Service
  backend:
    image: ghcr.io/benediktzanker/casacue/backend:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=casacue;Username=casacue;Password=password"
    depends_on:
      - database
    # The command waits for the database to be ready, applies EF migrations, and then starts the application.
    command: >
      sh -c "./docker/scripts/wait-for-it.sh database:5432 -- 
             dotnet ef database update --project CasaCue &&
             dotnet CasaCue.dll"

  # Authentication Service
  auth:
    image: ghcr.io/benediktzanker/casacue/auth:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      JWT_Secret: mySuperSecretKeyForJWT123mySuperSecretKeyForJWT123
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=casacue;Username=casacue;Password=password"
    depends_on:
      - database
    # Similar command structure as the backend service.
    command: >
      sh -c "./docker/scripts/wait-for-it.sh database:5432 -- 
             dotnet ef database update --project CasaCue.Auth &&
             dotnet CasaCue.Auth.dll"

volumes:
  db_data:
