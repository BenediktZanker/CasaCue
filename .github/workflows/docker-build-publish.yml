name: Build and Publish to GitHub Packages

on:
  push:
    branches:
      - main  # Trigger Workflow only on pushes to the 'main' branch

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      # Fetch the latest code from the repository
      - name: Check out the repository
        uses: actions/checkout@v3

      # Step 2: Set up .NET environment
      # Install the required .NET SDK version
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      # Step 3: Restore .NET dependencies
      # Restore all dependencies specified in the project
      - name: Install dependencies
        run: dotnet restore

      # Step 4: Build the project
      # Compile the application in Release mode
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Step 5: Run tests
      # Execute all unit and integration tests
      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

      # Step 6: Log in to GitHub Container Registry
      # Authenticate with GitHub Container Registry using the GitHub-provided token
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      # Step 7: Build and push Backend Docker image
      # Create the backend container image and push it to GitHub Container Registry
      - name: Build and push Backend Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:latest ./docker/backend
          docker push ghcr.io/${{ github.repository }}/backend:latest

      # Step 8: Build and push Auth Docker image
      # Create the auth container image and push it to GitHub Container Registry
      - name: Build and push Auth Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/auth:latest ./docker/auth
          docker push ghcr.io/${{ github.repository }}/auth:latest


