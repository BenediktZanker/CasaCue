name: Build and Publish Docker Images

on:
  push:
    branches:
      - main  # Workflow wird bei Pushes auf den Branch 'main' ausgelöst

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "mySuperSecretKeyForJWT123!@#$mySuperSecretKeyForJWT123!@#$"
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=casacue_db;Username=casacue;Password=password"

    steps:
      # Schritt 1: Check out Repository
      - name: Check out repository
        uses: actions/checkout@v3

      # Schritt 2: Set up .NET
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      # Schritt 3: Restore .NET Dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Schritt 4: Build the Project
      - name: Build the project
        run: dotnet build --configuration Release --no-restore

      # Schritt 5: Run Tests
      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

      # Schritt 6: Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      # Schritt 7: Build and Push Backend Docker Image
      - name: Build and Push Backend Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:latest ./docker/backend
          docker push ghcr.io/${{ github.repository }}/backend:latest

      # Schritt 8: Build and Push Auth Docker Image
      - name: Build and Push Auth Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/auth:latest ./docker/auth
          docker push ghcr.io/${{ github.repository }}/auth:latest

      # Schritt 9: Build and Push Database Docker Image (optional, falls eigene DB-Images)
      
      - name: Build and Push Database Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/database:latest ./docker/database
          docker push ghcr.io/${{ github.repository }}/database:latest

