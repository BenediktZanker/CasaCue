name: .NET CI and Test

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=casacue;Username=casacue;Password=password"

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.0'
      
      - name: Install docker-compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
    
      
      # Optional: Wenn du dotnet-ef brauchst, um Migrationen manuell auszuführen,
      # kannst du die Installation beibehalten. Falls du Migrationen über die 
      # Anwendung beim Start anwendest, ist das nicht nötig.
      - name: Install dotnet-ef as local tool
        run: dotnet new tool-manifest && dotnet tool install dotnet-ef

      # Starte das gesamte Container-Cluster mit Backend, Auth und Database
      - name: Start services
        run: docker-compose up -d --build

      # Warte bis Backend läuft (wenn du eine /health-Route hast)
      - name: Wait for Backend
        run: |
          until curl -sSf http://localhost:5001/health; do
            echo "Waiting for Backend..."
            sleep 5
          done

      # Warte bis Auth läuft (wenn du eine /health-Route hast)
      - name: Wait for Auth
        run: |
          until curl -sSf http://localhost:5002/health; do
            echo "Waiting for Auth..."
            sleep 5
          done

      # Dependencies für Tests (wenn nötig)
      - name: Restore dependencies
        run: |
          dotnet restore CasaCue/CasaCue.csproj
          dotnet restore CasaCue.Tests/CasaCue.Tests.csproj

      # Projekt builden
      - name: Build project
        run: dotnet build CasaCue/CasaCue.csproj --configuration Release --no-restore

      # Tests ausführen
      - name: Run tests
        run: dotnet test CasaCue.Tests/CasaCue.Tests.csproj --no-restore --verbosity normal
