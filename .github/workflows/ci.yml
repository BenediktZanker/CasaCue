name: CI Pipeline

on:
  push:
    branches:
      - main
      - hito4
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Check Docker Compose Version
      - name: Check Docker Compose Version
        run: docker-compose --version

      # Build and Run Docker Compose
      - name: Build and Start Docker Compose
        run: docker compose -f docker-compose.yml up --build -d

      # Run Tests
      - name: Run Tests
        run: |
          docker compose exec casacue_backend dotnet test /app/CasaCue.Tests/CasaCue.Tests.csproj
          docker compose exec casacue_auth dotnet test /app/CasaCue.Auth.Tests/CasaCue.Auth.Tests.csproj

      # Stop and Clean Up Docker Compose
      - name: Clean Up
        run: docker compose down -v
