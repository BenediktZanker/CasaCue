name: .NET CI and Test

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.0'

      # Lokales Tool-Manifest erstellen und dotnet-ef installieren
      - name: Install dotnet-ef as local tool
        run: dotnet new tool-manifest && dotnet tool install dotnet-ef

      - name: Start PostgreSQL service
        run: |
          docker run --name test-database -e POSTGRES_USER=casacue -e POSTGRES_PASSWORD=password -e POSTGRES_DB=casacue_db -p 5432:5432 -d postgres:15

      - name: Wait for PostgreSQL to be ready
        run: |
          until docker exec test-database pg_isready -U casacue; do
            echo "Waiting for database to be ready..."
            sleep 5
          done
        shell: bash

      - name: Restore dependencies
        run: |
          dotnet restore CasaCue/CasaCue.csproj
          dotnet restore CasaCue.Tests/CasaCue.Tests.csproj

      # EF-Migrationen anwenden mit lokalem Tool
      - name: Apply EF migrations
        run: dotnet tool run dotnet-ef database update --project CasaCue/CasaCue.csproj

      - name: Build project
        run: dotnet build CasaCue/CasaCue.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CasaCue.Tests/CasaCue.Tests.csproj --no-restore --verbosity normal

