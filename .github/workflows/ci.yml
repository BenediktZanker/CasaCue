name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
      - hito4
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Stelle sicher, dass dies mit deinem Projekt übereinstimmt

      # Restore NuGet Packages
      - name: Restore NuGet Packages
        run: dotnet restore

      # Install Docker and Docker Compose
      - name: Install Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io

      # Check Docker Compose Version
      - name: Check Docker Compose Version
        run: docker compose version

      # Build and Start Docker Compose
      - name: Build and Start Docker Compose
        run: docker compose -f docker-compose.yaml up --build -d

      # Check Running Containers
      - name: Check Running Containers
        run: docker compose ps

      # Wait for Backend to Be Ready
      - name: Wait for Backend to Be Ready
        run: sleep 10

      # Debugging: Show Logs for Backend
      - name: Run Logs
        run: docker compose logs backend

      # Run Tests
      - name: Run Tests
        run: dotnet test CasaCue.Tests/CasaCue.Tests.csproj --no-restore --verbosity normal

      # Stop and Clean Up Docker Compose
      - name: Clean Up
        run: docker compose down -v

  publish:
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      # Checkout the Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Install Docker
      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io

      # Log in to GitHub Packages
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GH_USERNAME }}" --password-stdin

      # Build and Push Backend Image
      - name: Build and Push Backend Image
        run: |
          docker build -t ghcr.io/benediktzanker/casacue/backend:latest -f docker/backend/Dockerfile .
          docker push ghcr.io/benediktzanker/casacue/backend:latest

      # Build and Push Auth Image
      - name: Build and Push Auth Image
        run: |
          docker build -t ghcr.io/benediktzanker/casacue/auth:latest -f docker/auth/Dockerfile .
          docker push ghcr.io/benediktzanker/casacue/auth:latest
