name: CI Pipeline

on:
  push:
    branches:
      - main
      - hito4
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Install Dependencies
      - name: Install Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Check Docker Compose Version
      - name: Check Docker Compose Version
        run: docker compose version

      # Build and Start Docker Compose
      - name: Build and Start Docker Compose
        run: docker compose -f docker-compose.yaml up --build -d

      # Check Running Containers
      - name: Check Running Containers
        run: docker compose ps

      # Run Tests
      - name: Run Backend Tests
        run: docker compose exec casacue_backend dotnet test /app/CasaCue.Tests/CasaCue.Tests.csproj

      - name: Run Auth Tests
        run: docker compose exec casacue_auth dotnet test /app/CasaCue.Auth.Tests/CasaCue.Auth.Tests.csproj

      # Stop and Clean Up Docker Compose
      - name: Clean Up
        run: docker compose down -v
