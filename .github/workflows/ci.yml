name: CI Pipeline

on:
  push:
    branches:
      - main
      - hito4
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Check Docker Compose Version
      - name: Check Docker Compose Version
        run: docker compose version

      # Ensure Previous Containers Are Down
      - name: Stop All Containers
        run: docker compose down -v || true

      # Build and Start Docker Compose
      - name: Build and Start Docker Compose
        run: docker compose -f docker-compose.yaml up --build -d

      # Wait for Services to Start
      - name: Wait for Services to Start
        run: sleep 10

      # Run Tests
      - name: Run Tests
        run: |
          docker compose exec casacue_backend dotnet test /app/CasaCue.Tests/CasaCue.Tests.csproj
          docker compose exec casacue_auth dotnet test /app/CasaCue.Auth.Tests/CasaCue.Auth.Tests.csproj

      # Collect Logs on Failure
      - name: Collect Logs on Failure
        if: failure()
        run: docker compose logs > docker-compose-logs.txt

      # Stop and Clean Up Docker Compose
      - name: Clean Up
        run: docker compose down -v
