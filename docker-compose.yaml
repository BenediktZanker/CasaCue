services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=casacue_db;Username=casacue;Password=password
      - AuthService__Url=http://auth:5002
    depends_on:
      database:
        condition: service_healthy
      auth:
        condition: service_started
    command: >
      sh -c "dotnet ef database update && dotnet run"

  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    ports:
      - "5002:5002"
    environment:
      - JWT_SECRET=mySuperSecretKeyForJWT123!@#$mySuperSecretKeyForJWT123!@#$

  database:
    image: postgres:15
    environment:
      - POSTGRES_USER=casacue
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=casacue_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casacue"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

